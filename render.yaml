services:
  - type: web
    name: startup-crm-api
    runtime: docker
    rootDir: server
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: startup-crm-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false

  # Marketing: Astro (rama landing fusionada en dev). Static Site aparte del CRM.
  - type: web
    name: startup-crm-landing
    runtime: static
    rootDir: landing
    plan: free
    buildCommand: npx --yes pnpm@9.15.9 install --frozen-lockfile && npx --yes pnpm@9.15.9 run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_CRM_APP_URL
        sync: false
