spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: postgres
    password: "Pino2026!"
  jpa:
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

logging:
  level:
    com.crm: DEBUG
  file:
    name: app.log
    max-size: 10MB
    max-history: 3

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    supportedSubmitMethods:
      - get
      - post
      - put
      - delete
      - patch
    persistAuthorization: true
    withCredentials: false
