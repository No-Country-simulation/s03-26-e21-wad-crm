spring:
  application:
    name: ${SERVER_NAME:}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  # Datasource (overridden per profile)
  datasource:
    url: ${POSTGRESQL_URL:}
    username: ${POSTGRESQL_USERNAME:}
    password: ${POSTGRESQL_PASSWORD:}
# JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: ${SERVER_LOCATIONS:}
    baseline-on-migrate: true
    out-of-order: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:}

  # Mail
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # WebSocket / STOMP
  websocket:
    allowed-origins: ${CORS_ORIGINS:}

# App config - all in one section
app:
  timezone: ${SERVER_TIMEZONE:}
  format_sql: ${SERVER_FORMAT_SQL:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry: ${JWT_EXPIRATION_MS:}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRATION_MS:}
  cors:
    allowed-origins: ${CORS_ORIGINS:}
  encryption:
    key: ${ENCRYPTION_KEY:}
  whatsapp:
    api-version: ${WA_API_VERSION:}
    webhook-path: ${WA_WEBHOOK_PATH:}
    access-token: ${WA_ACCESS_TOKEN:}
    phone-number-id: ${WA_PHONE_NUMBER_ID:}
    waba-id: ${WA_WABA_ID:}
    app-secret: ${WA_APP_SECRET:}
    webhook-verify-token: ${WA_WEBHOOK_VERIFY_TOKEN:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc (disabled by default, enabled in dev profile)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Server
server:
  port: ${SERVER_PORT:}

# Logging
logging:
  level:
    root: INFO
    com.crm: DEBUG
