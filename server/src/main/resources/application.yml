spring:
  application:
    name: startup-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Mail (override por perfil)
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # WebSocket / STOMP
  websocket:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900}       # 15 min en segundos
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800}  # 7 días en segundos
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  encryption:
    key: ${ENCRYPTION_KEY:changeme-encryption-key-32ch}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.crm: DEBUG
