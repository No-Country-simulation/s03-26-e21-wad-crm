spring:
  application:
    name: startup-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource (overridden per profile)
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: postgres
    password: "Pino2026!"
  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # WebSocket / STOMP
  websocket:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# App config - all in one section
app:
  timezone: America/Guayaquil
  format_sql: true
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
    access-token-expiry: 86400000      # 24 hours in ms
    refresh-token-expiry: 604800000    # 7 days in ms
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  encryption:
    key: ${ENCRYPTION_KEY:your-aes-256-key-here-change-in-production}
  whatsapp:
    api-version: ${WA_API_VERSION:v22.0}
    webhook-path: /webhooks/whatsapp
    # Dev credentials loaded from .env
    access-token: ${WA_ACCESS_TOKEN:}
    phone-number-id: ${WA_PHONE_NUMBER_ID:}
    waba-id: ${WA_WABA_ID:}
    app-secret: ${WA_APP_SECRET:}
    webhook-verify-token: ${WA_WEBHOOK_VERIFY_TOKEN:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc (disabled by default, enabled in dev profile)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Server
server:
  port: ${PORT:8080}

# Logging
logging:
  level:
    root: INFO
    com.crm: DEBUG
