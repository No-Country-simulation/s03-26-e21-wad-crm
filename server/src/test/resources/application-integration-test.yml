spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

app:
  jwt:
    secret: test-secret-key-at-least-32-chars-long!!
    access-token-expiry: 900
    refresh-token-expiry: 604800
  encryption:
    key: test-encryption-key-32chars!!

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
